<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Tumor Detection</title>
    <link rel="stylesheet" href="/static/index.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <video autoplay muted loop id="bg-video">
        <source src="/static/vecteezy_conceptual-3d-animation-of-digital-brain-hologram-with-ai_11591321.mp4" type="video/mp4">
    </video>

    <div class="main-container">
        <!-- Tagline -->
        <h2 class="tagline">
            "Empowering Diagnosis with AI Precision!"
        </h2>

        <div class="detection-container">
            <h1 class="title">Brain Tumor Detection</h1>
            
            <!-- Blue Box for Upload Label -->
            <div class="upload-label-container">
                <label for="imageUpload" class="upload-label">
                    <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    Upload MRI Scan
                </label>
            </div>
            
            <!-- Upload Container -->
            <div id="uploadContainer" class="upload-container">
                <form id="upload-file" method="post" enctype="multipart/form-data" style="display: none;">
                    <input type="file" name="file" id="imageUpload" accept=".png, .jpg, .jpeg">
                </form>
                <div class="image-section" style="display:none;">
                    <img id="imagePreview" class="img-responsive" src="#" style="width:300px;height:300px;"/>
                </div>
            </div>
            
            <!-- Button Container -->
            <div class="button-container">
                <button onclick="initializeUploadContainer()" class="action-button reupload-button">
                    <svg class="button-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Re-upload
                </button>
                <button id="btn-predict" class="action-button predict-button">
                    <svg class="button-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
                    </svg>
                    Predict
                </button>
            </div>
        </div>
    </div>

    <div class="loader" style="display:none;"></div>

    <h3 id="result">
        <span> </span>
    </h3>

    <script src="/static/index.js"></script>
</body>
</html>
